name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SDK 声明支持 Windows / macOS / Linux（discovery 文件路径三平台不同），
        # 所以三个平台都跑测试，避免只在 CI 的 Linux 上通过而 Windows 用户跑不起来。
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      # gofmt 不一致会让下游 diff 里混入无关格式改动，直接在 CI 拦掉。
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "以下文件未格式化："
            echo "$diff"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

  # 编译检查示例：示例编不过等于文档说谎。
  build-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go build ./examples/...
