name: ci

on:
  push:
    branches: [main]
    tags: ["v*", "*/v*"]
  pull_request:

# 这个仓库是 monorepo：未来会有 local-ai-runtime-sdk/python/、其他产品的
# SDK 等等。CI 按目录路径过滤，改一个语言不跑另一个语言的测试。
jobs:
  go:
    name: Go (local-ai-runtime-sdk/go)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SDK 声明支持 Windows / macOS / Linux（discovery 文件路径三平台不同），
        # 所以三个平台都跑测试，避免只在 CI 的 Linux 上通过而 Windows 用户跑不起来。
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.x"]
    defaults:
      run:
        # 子目录模块：所有命令都在这里跑。
        working-directory: local-ai-runtime-sdk/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: local-ai-runtime-sdk/go/go.mod

      # gofmt 不一致会让下游 diff 里混入无关格式改动，直接在 CI 拦掉。
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "以下文件未格式化："
            echo "$diff"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

  # 编译检查示例：示例编不过等于文档说谎。
  go-examples:
    name: Go examples build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-ai-runtime-sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: local-ai-runtime-sdk/go/go.mod
      - run: go build ./examples/...

  # Python SDK：三平台 × 三个 Python 版本。
  #
  # discovery 文件路径三平台不同（Windows 用 LOCALAPPDATA、Linux 用
  # XDG_DATA_HOME、macOS 用 ~/.local-ai-hub），而 CI 的 Linux 只覆盖
  # 其中一条分支——所以必须都跑。
  #
  # 3.9 是声明的最低版本：代码里用 Optional[X] 而不是 X | None，
  # 就是为了在 3.9 上 typing.get_type_hints() 不会炸。
  python:
    name: Python (local-ai-runtime-sdk/python)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: local-ai-runtime-sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 运行时依赖为空，所以只装开发工具。
      # tomli 是给 3.9/3.10 用的 tomllib 后备（校验脚本需要）。
      - name: 安装开发依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff tomli

      - name: ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: ruff check localai tests scripts examples

      - name: mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: mypy localai
      # 关键：不设 LAIH_E2E，test_live.py 应全部跳过而不是失败。
      - name: pytest
        run: pytest -v

      # 示例编不过/跑不起来等于文档说谎。这里只验证它能启动并正确
      # 列出功能——真实运行需要 Runtime，CI 里没有。
      - name: 示例可运行（--list）
        run: python examples/demo.py --list

      # 无 Runtime 时示例必须给出可操作的提示并以非零退出，
      # 而不是抛 traceback 让用户不知所措。
      - name: 示例在无 Runtime 时优雅失败
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          LAIH_URL=http://127.0.0.1:1 python examples/demo.py chat > out.txt 2>&1
          code=$?
          cat out.txt
          if [ "$code" -eq 0 ]; then
            echo "::error::Runtime 不可用时示例应以非零退出"
            exit 1
          fi
          if grep -q "Traceback" out.txt; then
            echo "::error::示例打印了 traceback，应给出可操作的提示"
            exit 1
          fi
          if ! grep -q "localai-cli serve" out.txt; then
            echo "::error::提示里没有告诉用户怎么启动 Runtime"
            exit 1
          fi
          echo "✓ 无 Runtime 时给出可操作提示，未抛 traceback"

      # 零依赖是设计约束，必须在 CI 里守住：一旦有人加了一条
      # dependencies，这里会立刻失败。
      #
      # 用独立脚本而不是内联 shell + python -c：多行源码经 bash 传给
      # `python -c` 时换行与缩进会被保留，Python 报 IndentationError，
      # 最终拿到空串并报出"dependencies 应为空"这种完全误导的信息。
      # 详见 scripts/check_no_deps.py 的注释。
      - name: 校验零运行时依赖
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/check_no_deps.py

  # 打包检查：构建不出来等于发不了版。
  python-package:
    name: Python wheel build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-ai-runtime-sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel --outdir dist
      - name: 校验包内含 py.typed 与 LICENSE
        run: python scripts/check_wheel.py

  # 子目录模块的 tag 必须带目录前缀（local-ai-runtime-sdk/go/v0.1.0）。
  #
  # 裸 tag（v0.1.0）不会让 go get 报"tag 写错了"，而是报一句极具误导性的
  # "module found, but does not contain package ..."。打错了几乎没人能自己
  # 诊断出来。所以在发布环节就拦掉，而不是等下游踩。
  tag-format:
    name: Tag 格式
    runs-on: ubuntu-latest
    # 只在推送 tag 时跑（分支推送与 PR 没有 tag 语义）
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 检查 tag 是否带模块目录前缀
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # 裸版本号（v1.2.3 / v1.2.3-rc.1）意味着"仓库根是 Go 模块"，
          # 但本仓库根没有 go.mod。这种 tag 一定对应某个子目录模块被漏写了前缀。
          if [[ "$tag" =~ ^v[0-9] ]]; then
            echo "::error::tag '$tag' 缺少模块目录前缀。"
            echo ""
            echo "本仓库是多模块 monorepo，Go 模块在子目录里，tag 必须写成："
            echo "  local-ai-runtime-sdk/go/v1.2.3"
            echo ""
            echo "裸 tag 会让下游 go get 报 'does not contain package'，"
            echo "而不是提示你 tag 写错了。"
            exit 1
          fi

          # 带前缀的 tag：确认目录真实存在（目录名拼错就永远拉不到）。
          moddir="${tag%/v*}"
          if [ ! -d "$moddir" ]; then
            echo "::error::tag '$tag' 指向的目录 '$moddir' 不存在。"
            echo "仓库现有目录："
            find . -maxdepth 3 -type d -not -path './.git*' -not -name '*' | sed 's|^\./|  |'
            exit 1
          fi

          # 是 Go 模块目录时，必须是合法的模块路径形状。
          #
          # 注意不要要求"目录里一定有 go.mod"：未来的 local-ai-runtime-sdk/python/
          # 之类目录没有 go.mod，tag 却是合法的。只在有 go.mod 时才检查。
          if [ -f "$moddir/go.mod" ]; then
            modpath=$(awk '/^module /{print $2; exit}' "$moddir/go.mod")
            want="github.com/${GITHUB_REPOSITORY}/${moddir}"
            if [ "$modpath" != "$want" ]; then
              echo "::error::tag '$tag' 与模块路径不匹配。"
              echo "  $moddir/go.mod 声明：$modpath"
              echo "  tag 隐含的路径应为：$want"
              echo ""
              echo "两者必须一致，否则 go get 拉不到。"
              exit 1
            fi
            echo "✓ tag '$tag' 格式正确（Go 模块 $modpath）"
          else
            echo "✓ tag '$tag' 格式正确（非 Go 目录，仅标记发布点）"
          fi
